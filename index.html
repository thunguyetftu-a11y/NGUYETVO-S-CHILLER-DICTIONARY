<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGUYETVO's Chiller Dictionary Learning Program</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Screen 1: Welcome & Name Entry -->
        <div id="welcomeScreen" class="screen active">
            <div class="welcome-content">
                <h1>🌟 Daikin Chiller Dictionary</h1>
                <h2>Learning Program</h2>
                <div class="form-group">
                    <label for="playerName">Enter Your Name:</label>
                    <input type="text" id="playerName" placeholder="Your name..." />
                    <button id="startBtn" class="btn btn-primary">Start Learning</button>
                </div>
            </div>
        </div>

        <!-- Screen 2: Group Selection -->
        <div id="groupSelectionScreen" class="screen">
            <div class="selection-content">
                <h2>Select Chiller Groups to Study</h2>
                <p class="subtitle">Choose one or more groups</p>
                <div id="groupsList" class="groups-container">
                    <!-- Groups will be dynamically populated -->
                </div>
                <button id="beginQuizBtn" class="btn btn-primary" disabled>Begin Quiz</button>
            </div>
        </div>

        <!-- Screen 3: Quiz Screen -->
        <div id="quizScreen" class="screen">
            <div class="quiz-wrapper">
                <!-- Left Panel: Standard Points -->
                <div class="score-panel left-panel">
                    <div class="score-section">
                        <h3>Standard Points</h3>
                        <div id="standardScore" class="score-display">0</div>
                    </div>
                </div>

                <!-- Center: Question and Options -->
                <div class="quiz-content">
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                    
                    <div class="question-container">
                        <div class="question-info">
                            <span id="questionNumber" class="question-num">Question 1/10</span>
                            <span id="timer" class="timer">10s</span>
                        </div>
                        <h3 id="questionText" class="question-text"></h3>
                    </div>

                    <div id="optionsContainer" class="options-container">
                        <!-- Options will be dynamically populated -->
                    </div>
                </div>

                <!-- Right Panel: Bonus Points -->
                <div class="score-panel right-panel">
                    <div class="score-section">
                        <h3>Bonus Points</h3>
                        <div id="bonusScore" class="score-display">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Screen 4: Results Screen -->
        <div id="resultsScreen" class="screen">
            <div class="results-content">
                <h2>Quiz Complete! 🎉</h2>
                <div class="final-score">
                    <div class="score-item">
                        <span class="label">Standard Points:</span>
                        <span id="finalStandardScore" class="value">0</span>
                    </div>
                    <div class="score-item">
                        <span class="label">Bonus Points:</span>
                        <span id="finalBonusScore" class="value">0</span>
                    </div>
                    <div class="score-item total">
                        <span class="label">Total Score:</span>
                        <span id="finalTotalScore" class="value">0</span>
                    </div>
                </div>
                
                <div id="leaderboard" class="leaderboard">
                    <h3>Leaderboard</h3>
                    <div id="leaderboardList" class="leaderboard-list">
                        <!-- Leaderboard will be populated here -->
                    </div>
                </div>

                <div class="button-group">
                    <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
                    <button id="changeGroupsBtn" class="btn btn-secondary">Change Groups</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/scoring.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
